
name: Sentinel HYPE read-only scan

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'paper-*.mjs'
      - 'restore-paper-journal.mjs'
      - '.github/workflows/hype-scan.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: sentinel-hype-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify paper journal accounting
        run: node test-paper-journal.mjs

      - name: Scan latest completed HYPE candle
        id: scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scan.mjs

      - name: Simulate qualifying HYPE signal
        if: steps.scan.outputs.candle_key != ''
        run: node simulate.mjs

      - name: Save simulation result
        if: steps.scan.outputs.candle_key != ''
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-paper-${{ github.run_id }}
          path: simulated-order.json
          if-no-files-found: warn
          retention-days: 30
      - name: Check prior notification for this candle
        if: steps.scan.outputs.candle_key != ''
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: sent-candle.txt
          key: hype-alert-${{ steps.scan.outputs.candle_key }}
          lookup-only: true

      - name: Send only if not previously sent
        if: steps.scan.outputs.candle_key != '' && steps.cache.outputs.cache-hit != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node send.mjs
          echo "${{ steps.scan.outputs.candle_key }}" > sent-candle.txt

      - name: Remember sent candle
        if: steps.scan.outputs.candle_key != '' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: sent-candle.txt
          key: hype-alert-${{ steps.scan.outputs.candle_key }}

      # These run after notifications so a paper-tracking error cannot suppress alerts.
      - name: Restore background paper journal
        id: restore_journal
        if: ${{ !cancelled() && steps.scan.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node restore-paper-journal.mjs

      - name: Advance background paper trades
        id: paper_journal
        if: ${{ !cancelled() && steps.restore_journal.outcome == 'success' }}
        run: node paper-journal.mjs

      - name: Save background paper journal
        if: ${{ !cancelled() && steps.paper_journal.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-journal-${{ github.run_id }}
          path: paper-journal.json
          if-no-files-found: error
          retention-days: 7
