name: Sentinel approval safety tests
on:
  pull_request:
    paths:
      - 'approval-core.mjs'
      - 'approval-core.test.mjs'
      - 'telegram-approval-server.mjs'
      - '.github/workflows/approval-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax checks
        run: |
          node --check approval-core.mjs
          node --check telegram-approval-server.mjs
          node --check approval-prototype.mjs
      - name: Paper approval unit tests
        run: node --test approval-core.test.mjs
